<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-version" content="1.0.0">
  <meta name="description" content="A classic Flappy Bird game and a small Git and GitHub teaching project.">
  <meta name="theme-color" content="#71c5cf">
  <title>Flappy Bird Showcase</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1 class="sr-only">Flappy Bird Showcase</h1>
    <nav class="toolbar" aria-label="Game controls">
      <div class="mode-switch" role="group" aria-label="Game mode">
        <button type="button" data-mode="classic" aria-pressed="false">Classic</button>
        <button type="button" data-mode="rocket" aria-pressed="true">Overdrive</button>
      </div>
      <button id="settings-open" type="button">Settings</button>
    </nav>
    <div class="playfield">
      <canvas id="game" width="288" height="512" tabindex="0" role="application" aria-label="Flappy Bird. Press Space or Arrow Up, click, or tap to flap.">
        This game needs JavaScript and a browser with canvas support.
      </canvas>
    </div>
    <p id="game-status" class="sr-only" role="status" aria-live="polite">Get ready to fly.</p>
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <div class="settings-heading">
      <h2 id="settings-title">Settings</h2>
      <form method="dialog"><button type="submit">Close</button></form>
    </div>
    <button id="fullscreen" type="button">Enter full screen</button>
    <p id="screen-status" role="status">Full screen fits the game to your display. Esc exits.</p>
    <button id="pause" type="button" hidden>Pause game</button>
    <button id="sound" type="button" aria-label="Game sound" aria-pressed="true">Sound: on</button>
    <details class="recordings">
      <summary>Recordings</summary>
      <label for="replays">Recordings</label>
      <select id="replays"><option value="">Choose a recording</option></select>
      <button id="watch-replay" type="button">Watch replay</button>
      <p id="recording-status" role="status">Games save automatically in recordings/.</p>
      <button id="retry-save" type="button" hidden>Retry saving</button>
    </details>
    <p class="controls-help">Space, ↑ or tap to flap. Hold to rise with a jetpack. P pauses.</p>
  </dialog>
</body>
</html>
